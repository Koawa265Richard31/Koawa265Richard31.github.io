<!-- Left sidebar drawer: site title, profile, nav, glass controls.
     Handle (pull tab) rides the panel edge; top header hidden by CSS. -->
<div class="sidebar-wrap" id="sidebar-wrap">
  <aside class="profile-sidebar" aria-label="站点导航与站长信息">
    <div class="sidebar-title"><a href="/">Koawa 工程日志</a></div>
    <img class="profile-avatar" src="/images/avatar.jpg" alt="Koawa 的头像" width="104" height="104" loading="lazy">
    <div class="profile-name">Koawa265</div>
    <nav class="profile-links">
      <a href="/">首页</a>
      <a href="/posts/">文章</a>
      <a href="/archives/">归档</a>
      <a href="/tags/">标签</a>
      <a href="/search/">搜索</a>
      <a href="/about/">关于</a>
      <a href="https://github.com/Koawa265Richard31" rel="me">GitHub</a>
      <a href="/index.xml">RSS</a>
    </nav>
  </aside>
  <button class="sidebar-handle" id="sidebar-handle" type="button" aria-label="展开侧栏">›</button>
</div>

<!-- Glass control knobs: pinned to the top-right corner of the content card.
     Same element IDs as before so the JS below keeps working. -->
<div class="glass-fabs" role="group" aria-label="毛玻璃外观控制">
  <button id="glass-knob" class="glass-knob" type="button" title="毛玻璃透明度（每按一次调一档）" aria-label="毛玻璃透明度，每按一次调一档">
    <span class="knob-needle"></span>
    <span id="knob-level" class="visually-hidden">4/8</span>
  </button>
  <button id="glass-blur" class="glass-knob glass-knob--blur" type="button" title="毛玻璃模糊度（每按一次调一档）" aria-label="毛玻璃模糊度，每按一次调一档">
    <span class="blur-icon" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="blur-level" class="visually-hidden">4/6</span>
  </button>
  <button id="glass-tint" class="glass-knob glass-knob--tint" type="button" title="卡片色泽：暗玻璃 / 亮玻璃" aria-label="切换卡片色泽">
    <span class="tint-dot" aria-hidden="true"></span>
  </button>
</div>
<script>
(function () {
  var wrap = document.getElementById('sidebar-wrap');
  var handle = document.getElementById('sidebar-handle');
  var wide = window.matchMedia('(min-width: 1440px)');
  var SKEY = 'sidebar-open';

  function setOpen(o) {
    wrap.classList.toggle('open', o); document.documentElement.classList.toggle('sb-open', o);
    handle.textContent = o ? '‹' : '›';
    handle.setAttribute('aria-label', o ? '收起侧栏' : '展开侧栏');
    try { localStorage.setItem(SKEY, o ? '1' : '0'); } catch (e) {}
  }
  var stored = null;
  try { stored = localStorage.getItem(SKEY); } catch (e) {}
  setOpen(stored !== null ? stored === '1' : wide.matches);
  handle.addEventListener('click', function () { setOpen(!wrap.classList.contains('open')); });

  /* Transparency knob: 8 fine steps, needle rotates 45 deg per press, alpha animates. */
  var LEVELS = [25, 35, 45, 55, 65, 75, 85, 95];
  var knob = document.getElementById('glass-knob');
  var lvl = document.getElementById('knob-level');
  var levelIdx = 3;
  try {
    var li = parseInt(localStorage.getItem('glass-level'), 10);
    if (li >= 0 && li < LEVELS.length) levelIdx = li;
  } catch (e) {}
  function applyLevel(i) {
    document.documentElement.style.setProperty('--glass-alpha', LEVELS[i]);
    knob.style.setProperty('--knob-rot', (i * 45) + 'deg');
    lvl.textContent = (i + 1) + '/' + LEVELS.length;
    try { localStorage.setItem('glass-level', String(i)); } catch (e) {}
  }
  applyLevel(levelIdx);
  knob.addEventListener('click', function () {
    levelIdx = (levelIdx + 1) % LEVELS.length;
    applyLevel(levelIdx);
  });

  /* Card tint switch: default = dark glass; button flips to white glass (card-light). */
  var tint = document.getElementById('glass-tint');
  function applyTint(light) {
    document.documentElement.classList.toggle('card-light', light);
    try { localStorage.setItem('glass-tint', light ? 'light' : 'dark'); } catch (e) {}
  }
  var savedTint = null;
  try { savedTint = localStorage.getItem('glass-tint'); } catch (e) {}
  if (savedTint === 'light') applyTint(true);
  tint.addEventListener('click', function () {
    applyTint(!document.documentElement.classList.contains('card-light'));
  });

  /* Blur knob: 6 steps of --glass-blur (px), persisted. */
  var BLURS = [0, 8, 14, 20, 26, 32];
  var blurBtn = document.getElementById('glass-blur');
  var blurLvl = document.getElementById('blur-level');
  var blurIdx = 3; // 20px，与原默认一致
  try {
    var bi = parseInt(localStorage.getItem('glass-blur'), 10);
    if (bi >= 0 && bi < BLURS.length) blurIdx = bi;
  } catch (e) {}
  function applyBlur(i) {
    document.documentElement.style.setProperty('--glass-blur', BLURS[i] + 'px');
    blurBtn.style.setProperty('--blur-rot', (i * 60) + 'deg');
    blurLvl.textContent = (i + 1) + '/' + BLURS.length;
    try { localStorage.setItem('glass-blur', String(i)); } catch (e) {}
  }
  applyBlur(blurIdx);
  blurBtn.addEventListener('click', function () {
    blurIdx = (blurIdx + 1) % BLURS.length;
    applyBlur(blurIdx);
  });
})();
</script>
